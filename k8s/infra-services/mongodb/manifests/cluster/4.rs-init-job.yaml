apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-rs-init
  labels:
    app: mongodb
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongodb-rs-init
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              PRIMARY_HOST="mongodb-0.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017"
              MONGO_NODES="[
                { _id: 0, host: 'mongodb-0.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017' },
                { _id: 1, host: 'mongodb-1.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017' },
                { _id: 2, host: 'mongodb-2.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017' }
              ]"

              echo "Waiting for ${PRIMARY_HOST} to accept connections..."
              for i in {1..60}; do
                if mongosh --host "${PRIMARY_HOST}" --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q "1"; then
                  break
                fi
                sleep 5
              done

              echo "Initializing replica set if needed..."
              mongosh --host "${PRIMARY_HOST}" --quiet --eval "
                try {
                  var status = rs.status();
                  if (status.ok === 1) {
                    print('Replica set already initialized');
                  }
                } catch (e) {
                  rs.initiate({
                    _id: 'rs0',
                    members: ${MONGO_NODES}
                  });
                  print('Replica set initialized');
                }
              "
